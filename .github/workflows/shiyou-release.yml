# Fork-owned: builds unsigned Shiyou Desktop installers on GitHub-hosted runners and publishes them to a GitHub Release.
# Kept in its own file so upstream packaging workflows merge without conflicts.
name: Shiyou release · Windows x64 + macOS arm64

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Published version; blank uses the product version in apps/desktop/package.json'
        type: string
        default: ''
        required: false
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: shiyou-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Write unsigned Windows packaging settings
        # The mandatory-update policy is required for Windows builds; Shiyou has no policy service, so the origin uses the
        # reserved .invalid domain. Policy requests then fail without blocking the app and nothing reaches DeepSeek.
        run: |
          @(
            'DSH_DESKTOP_APP_ID=com.shiyou.desktop'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://update.shiyou.invalid'
          ) | Set-Content -Encoding utf8 apps/desktop/.env.windows
      - name: Build unsigned installer
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          $packageArgs = @('run', 'package:desktop:win:x64:unsigned')
          if ($env:BUILD_VERSION) { $packageArgs += @('--build-version', $env:BUILD_VERSION) }
          pnpm @packageArgs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: shiyou-windows-x64
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shiyou-windows-x64-logs
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned DMG
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          args=()
          if [[ -n "$BUILD_VERSION" ]]; then args+=(--build-version "$BUILD_VERSION"); fi
          pnpm run package:desktop:mac:arm64:unsigned "${args[@]}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: shiyou-macos-arm64
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shiyou-macos-arm64-logs
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/package.json
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ inputs.build_version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="${BUILD_VERSION:-$(node -p "require('./apps/desktop/package.json').version")}"
          tag="shiyou-v${version}"
          mkdir release
          cp dist/*-win-x64-unsigned.exe "release/Shiyou-${version}-windows-x64.exe"
          cp dist/*-mac-arm64-unsigned.dmg "release/Shiyou-${version}-macos-arm64.dmg"
          (cd release && shasum -a 256 * > SHA256SUMS.txt)
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          cat > notes.md <<EOF
          Shiyou ${version} desktop client, built from ${GITHUB_SHA::7}.

          - **Windows x64:** \`Shiyou-${version}-windows-x64.exe\`. The installer is unsigned, so SmartScreen may warn: choose **More info → Run anyway**.
          - **macOS Apple Silicon:** \`Shiyou-${version}-macos-arm64.dmg\`. The app is not notarized: after copying it to Applications, right-click it and choose **Open**, or allow it in **System Settings → Privacy & Security**.
          EOF
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Shiyou ${version}" --notes-file notes.md "${flags[@]}"
